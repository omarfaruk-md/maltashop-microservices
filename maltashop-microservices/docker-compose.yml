services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15672:15672"]          # management UI (guest/guest, local only)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  order-service:
    build: ./order-service
    ports: ["8080:8000"]
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PATH: /data/orders.db
      LOG_LEVEL: ${LOG_LEVEL}
    volumes: ["order-data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}

  inventory-service:
    build: ./inventory-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PATH: /data/inventory.db
      LOG_LEVEL: ${LOG_LEVEL}
    volumes: ["inventory-data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}

  payment-service:
    build: ./payment-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PATH: /data/payments.db
      LOG_LEVEL: ${LOG_LEVEL}
    volumes: ["payment-data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      DB_PATH: /data/notifications.db
      LOG_LEVEL: ${LOG_LEVEL}
    volumes: ["notification-data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}

volumes:
  order-data:
  inventory-data:
  payment-data:
  notification-data:
