name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and contract tests
        working-directory: ${{ matrix.service }}
        run: python -m unittest discover -s tests -v

  build-and-smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create environment file
        run: cp .env.example .env
      - name: Build images once
        run: docker compose build
      - name: Start the whole system
        run: docker compose up -d --wait
      - name: Smoke test (happy path and compensation path)
        run: bash scripts/smoke_test.sh
      - name: Show logs if the run failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
